spring.application.name=gigo50-blog
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=GIGO50_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/gigo50_blog_db?useUnicode=true&characterEncoding=utf8mb4
spring.datasource.username=${DB_USER:gigo50_app}
spring.datasource.password=${DB_PASSWORD:ChangeThisStrongDbPass!2026}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

app.site.name=${SITE_NAME:Gigo50}
app.site.domain=${SITE_DOMAIN:gigo50.com}
app.site.tagline=${SITE_TAGLINE:Insights, Engineering & Research}
app.security.bootstrap-admin.username=${ADMIN_USERNAME:admin}
app.security.bootstrap-admin.password=${ADMIN_PASSWORD:ChangeMeAdmin!2026}